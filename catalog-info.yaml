apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tin-command-centre
  title: TIN Command Center
  description: >-
    The registry of what TIN runs, who owns it and whether it has drifted (package and registry slug tin-ops-console):
    declared state edited by admins against observed state collected from the estate.
  annotations:
    github.com/project-slug: tindevelopers/tin-command-centre
spec:
  type: website
  owner: group:tindevelopers
  lifecycle: production
  system: tin-estate
  providesApis: []
  consumesApis:
    - package:@tindevelopers/domain-identity
    - package:@tindevelopers/schema-identity
    - package:@tindevelopers/ui-shell
  dependsOn:
    - component:shared-identity-hub
    - component:shell-base-admin
    - component:shell-base-github-registry
    - component:tin-boss-api

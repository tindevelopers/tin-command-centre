name: Claude

# Lets people with write access ask Claude to work on an issue or pull request by mentioning @claude.
# Claude opens a draft pull request for review; it does not merge anything.
#
# One-time setup per repository (nothing runs until both are done):
#   1. Install the Claude GitHub app on the repository (Claude Code: /install-github-app).
#      The app is what lets pull requests opened by Claude start this repository's other workflows (CI).
#   2. Add the repository secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
#      To use a Claude subscription instead, set CLAUDE_CODE_OAUTH_TOKEN and swap the input named below.
#
# Only users with write access to the repository can trigger it (the action's default).

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Run only when the text actually mentions @claude.
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # lets Claude read CI results on its own pull requests
      id-token: write # the action exchanges this for a token from the Claude GitHub app
    steps:
      - name: Check the API key is set
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add it under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --append-system-prompt "Open pull requests as drafts. Never merge, enable auto-merge, or push to the default branch. Run this repository's own checks (the same ones CI runs) before pushing, and say in the pull request what you ran and what you could not run. Make the smallest change that does what the issue asks."

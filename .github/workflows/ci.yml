name: CI

# Task W1-07: this repository had no pull-request CI. The job id `quality` is the
# future required-check name (rulesets stay advisory while the org is on the Free
# plan, and this job is the whole gate until W2-03 moves it to the release kit).

on:
  pull_request:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    services:
      # The db/*.test.ts suites boot PGlite, an in-process WASM Postgres, so nothing
      # here connects to this container. It is provided because W1-07 asks for it and
      # because it is the one place a future suite that needs a real server (concurrent
      # sessions, roles a WASM build cannot model) can attach: DATABASE_URL points at
      # it below. `pg_isready` gates the job so a slow start cannot fail a test.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Read-only token for the @tindevelopers registry. The repo .npmrc
          # interpolates `${NPM_TOKEN}`; NODE_AUTH_TOKEN is the name setup-node and
          # pnpm read. Both point at the same repository secret, never a committed
          # value. `secrets.NODE_AUTH_TOKEN` exists (owner added it 2026-10-30).
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
